<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seasonal Health Insights | TerraPulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body { overflow: hidden; }
    .insights-shell { position: relative; width: 100vw; height: 100vh; background: #09151d; }
    .insights-bar {
      position: relative; z-index: 10; height: 72px; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem; padding: 0 1.25rem;
      background: rgba(8, 20, 28, 0.96); border-bottom: 1px solid rgba(182, 232, 229, 0.16);
      box-shadow: 0 12px 32px rgba(2, 8, 13, 0.28);
    }
    .insights-brand { display: flex; align-items: center; gap: 0.85rem; min-width: 0; }
    .insights-mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid rgba(182,232,229,.5); border-radius: 50%; background: rgba(182,232,229,.1); }
    .insights-mark svg { width: 22px; height: 22px; color: #b6e8e5; }
    .insights-title { color: #eef8f7; font: 700 1rem/1 Outfit, sans-serif; }
    .insights-subtitle { color: #8fa9ae; font: 500 .68rem/1.3 DM Sans, sans-serif; }
    .insights-back { flex: none; display: inline-flex; align-items: center; gap: .45rem; padding: .66rem .95rem; color: #eef8f7; background: rgba(182,232,229,.09); border: 1px solid rgba(182,232,229,.22); border-radius: 999px; font: 700 .78rem DM Sans, sans-serif; text-decoration: none; }
    .insights-back:hover { background: rgba(182,232,229,.16); border-color: rgba(182,232,229,.45); }
    .insights-frame-wrap { position: absolute; inset: 72px 0 0; background: #0b1020; }
    .insights-frame { width: 100%; height: 100%; border: 0; background: #0b1020; }
    .insights-status { position: absolute; inset: 72px 0 0; display: grid; place-items: center; color: #94a3b8; background: #0b1020; pointer-events: none; }
    .insights-frame.loaded + .insights-status { display: none; }
    @media (max-width: 620px) { .insights-subtitle { display:none; } .insights-bar { height:64px; padding:0 .75rem; } .insights-frame-wrap,.insights-status { inset:64px 0 0; } }
  </style>
</head>
<body>
  <main class="insights-shell">
    <header class="insights-bar">
      <div class="insights-brand">
        <span class="insights-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg></span>
        <div><div class="insights-title">Seasonal Health Intelligence</div><div class="insights-subtitle">TerraPulse · environmental and respiratory analysis</div></div>
      </div>
      <a class="insights-back" href="/#scene-seasonal">← Back to TerraPulse</a>
    </header>
    <div class="insights-frame-wrap">
      <iframe class="insights-frame" title="Seasonal health and air quality dashboard" src="{{ streamlit_url }}" allow="fullscreen" onload="this.classList.add('loaded')"></iframe>
      <div class="insights-status" role="status">Opening seasonal insights…</div>
    </div>
  </main>
</body>
</html>
